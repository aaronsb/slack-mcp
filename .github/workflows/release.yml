name: GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install mcpb CLI
        run: npm install -g @anthropic-ai/mcpb

      # This used to rewrite mcpb/manifest.json from git describe at build
      # time, which is how the checked-in manifest sat at 1.2.0 through releases
      # that shipped as 1.4.0 — CI papered over the drift on every run, so
      # nothing ever surfaced it. `make release` writes the version and commits
      # it now, so the tagged tree already records what it ships as, and this
      # asserts that rather than silently correcting it.
      - name: Check the tag matches every version source
        run: make version-check VERSION="${GITHUB_REF_NAME#v}"

      - name: Build all platforms
        run: make build-all-platforms

      - name: Build mcpb bundles
        run: make mcpb-all

      - name: Generate checksums
        run: |
          sha256sum build/slack-mcp-* slack-mcp-*.mcpb > checksums.txt
          cat checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" 2>/dev/null || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" build/slack-mcp-* slack-mcp-*.mcpb checksums.txt --clobber
